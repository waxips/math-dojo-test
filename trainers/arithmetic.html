const ri=(a,b)=>Math.floor(rand()*(b-a+1))+a;

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const f=n=>Number.isInteger(n)?String(n):String(Math.round(n*10000)/10000);

const term=(n,v)=>n===1?v:n===-1?`−${v}`:`${f(n)}${v}`;

function numberTask(prompt,math,value,hint,answer=f(value),visual=''){return{prompt,math,kind:'number',value,answer,hint,visual,key:prompt+'|'+math};}
function pairTask(prompt,math,values,hint,answer,visual=''){return{prompt,math,kind:'pair',value:values,answer,hint,visual,key:prompt+'|'+math};}
function choiceTask(prompt,math,choices,correct,hint){return{prompt,math,kind:'choice',choices,correct,hint,answer:'',key:prompt+'|'+math+'|'+choices.map(c=>c.key).join('|')};}
function makeArithmetic(){const a=ri(3,25),b=ri(2,12),c=ri(2,8),plus=rand()<.5;return numberTask(L.q.arithmetic,`${a} ${plus?'+':'−'} ${b} × ${c}`,plus?a+b*c:a-b*c,L.hints.arithmetic);}
function makeFractions(){let a=ri(1,8),b=ri(2,10),c=ri(1,8),d=ri(2,10);const op=rand()<.5?'+':'−';let n=op==='+'?a*d+c*b:a*d-c*b,den=b*d;if(op==='−'&&n<0){[a,c]=[c,a];[b,d]=[d,b];n=-n;}const g=gcd(n,den);return numberTask(L.q.fractions,`${a}/${b} ${op} ${c}/${d}`,n/den,L.hints.fractions,`${n/g}/${den/g}`.replace(/\/1$/,''));}
function makePercent(){const base=ri(4,40)*10,pct=pick([5,10,15,20,25,30,40,50]);if(rand()<.55)return numberTask(L.q.percentOf,`${pct}% ${L.geom.of} ${base}`,base*pct/100,L.hints.percentages);const up=rand()<.5;return numberTask(L.q.percentChange,`${L.geom.after}: ${base} · ${up?L.geom.up:L.geom.down} ${pct}%`,base*(1+(up?pct:-pct)/100),L.hints.percentages);}
function makePowers(){if(rand()<.5){const n=ri(2,17);return numberTask(L.q.powers,`${n}²`,n*n,L.hints.powers)}const n=ri(3,20);return numberTask(L.q.powers,`√${n*n}`,n,L.hints.powers);}
function makeLinearEq(){const x=ri(-9,10),a=pick([2,3,4,5,6,7]),b=ri(-14,14),rhs=a*x+b;return numberTask(L.q.linearEq,`${term(a,'x')}${sign(b)} = ${f(rhs)}`,x,L.hints.linearEq,`x = ${f(x)}`);}
function makeQuadraticEq(){let r1=ri(-6,5),r2=ri(-5,6);if(r1===r2)r2=r1===6?5:r1+1;const b=-(r1+r2),c=r1*r2;const roots=[r1,r2].sort((x,y)=>x-y);return pairTask(L.q.quadraticEq,`${poly(1,b,c)} = 0`,roots,L.hints.quadraticEq,`x₁ = ${roots[0]}, x₂ = ${roots[1]}`);}
function makeGeometry(){const mode=ri(0,2);if(mode===0){const a=ri(3,17),b=ri(2,15);return numberTask(L.q.geometryArea,`${L.geom.rectangle} · ${L.geom.sides}: ${a}, ${b}`,a*b,L.hints.geometry,`${a*b} ${L.geom.sq}`)}if(mode===1){const a=ri(3,17),b=ri(2,15);return numberTask(L.q.geometryPerimeter,`${L.geom.rectangle} · ${L.geom.sides}: ${a}, ${b}`,2*(a+b),L.hints.geometry,`${2*(a+b)} ${L.geom.units}`)}const triple=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[9,12,15]]);const scale=ri(1,3);return numberTask(L.q.geometryHyp,`${L.geom.legs}: ${triple[0]*scale}, ${triple[1]*scale}`,triple[2]*scale,L.hints.geometry,`${triple[2]*scale} ${L.geom.units}`);}

/* SVG graphing: same physical scale on both axes; curves are clipped to the plotting region. */
function svgGraph(spec,compact=false){
 const W=compact?260:400,H=compact?220:340,px=compact?30:40,py=10,S=compact?200:320,min=-6,max=6,step=S/(max-min),X=x=>px+(x-min)*step,Y=y=>py+(max-y)*step;
 const grid=[];for(let v=-6;v<=6;v++){const p=X(v),q=Y(v),axis=v===0;grid.push(`<line x1="${p}" y1="${py}" x2="${p}" y2="${py+S}" stroke="${axis?'#aaa0be':'#ebe6f3'}" stroke-width="${axis?1.8:1}"/>`);grid.push(`<line x1="${px}" y1="${q}" x2="${px+S}" y2="${q}" stroke="${axis?'#aaa0be':'#ebe6f3'}" stroke-width="${axis?1.8:1}"/>`);if(v!==0&&(compact?v%4===0:v%2===0)){grid.push(`<text x="${p}" y="${Y(0)+(compact?15:16)}" text-anchor="middle" fill="#9a90ac" font-size="${compact?13:11}" font-weight="700">${v}</text>`);grid.push(`<text x="${X(0)-9}" y="${q+4}" text-anchor="end" fill="#9a90ac" font-size="${compact?13:11}" font-weight="700">${v}</text>`);}}
 let path='';const fn=spec.kind==='line'?x=>spec.m*x+spec.b:x=>spec.a*(x-spec.h)**2+spec.k;
 for(let i=0;i<=720;i++){const x=min+(max-min)*i/720,y=fn(x);if(!Number.isFinite(y))continue;path+=`${i?'L':'M'}${X(x).toFixed(2)} ${Y(y).toFixed(2)} `;}
 const mark=spec.kind==='quad'&&spec.markVertex?`<circle cx="${X(spec.h)}" cy="${Y(spec.k)}" r="5.5" fill="#fff" stroke="#8a70d6" stroke-width="3"/>`:'';
 const id='clip'+Math.floor(rand()*1e9),ax=X(6),ay=Y(0),top=Y(6),cx=X(0);
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Function graph" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="${id}"><rect x="${px}" y="${py}" width="${S}" height="${S}" rx="3"/></clipPath></defs><rect width="${W}" height="${H}" fill="#fcfaff"/>${grid.join('')}<path d="M ${ax-8} ${ay-6} L ${ax} ${ay} L ${ax-8} ${ay+6}" fill="none" stroke="#aaa0be" stroke-width="1.7"/><path d="M ${cx-6} ${top+8} L ${cx} ${top} L ${cx+6} ${top+8}" fill="none" stroke="#aaa0be" stroke-width="1.7"/><text x="${ax+5}" y="${ay-5}" fill="#8f86a4" font-size="${compact?13:13}" font-weight="800">x</text><text x="${cx+10}" y="${top+7}" fill="#8f86a4" font-size="${compact?13:13}" font-weight="800">y</text><g clip-path="url(#${id})"><path d="${path}" fill="none" stroke="#8765d4" stroke-width="${compact?4.2:3.8}" stroke-linejoin="round" stroke-linecap="round"/>${mark}</g></svg>`;
}
function makeGraphChoices(kind,target){const choices=[target],used=new Set([JSON.stringify(target)]);let tries=0;while(choices.length<4&&tries++<100){let v;if(kind==='line'){v={kind:'line',m:pick([-2,-1,-.5,.5,1,2]),b:ri(-3,3)};if(v.m===target.m&&v.b===target.b)continue;}else{v={kind:'quad',a:pick([-1,1]),h:ri(-3,3),k:ri(-3,3)};if(v.a===target.a&&v.h===target.h&&v.k===target.k)continue;}const key=JSON.stringify(v);if(!used.has(key)){used.add(key);choices.push(v);}}const shuffled=shuffle(choices);return{choices:shuffled.map(v=>({key:JSON.stringify(v),svg:svgGraph(v,true)})),correct:shuffled.findIndex(v=>JSON.stringify(v)===JSON.stringify(target))};}
function makeLineFunction(){if(rand()<.55){const m=pick([-2,-1,-.5,.5,1,2]),b=ri(-3,3),target={kind:'line',m,b},opts=makeGraphChoices('line',target);const q=choiceTask(L.q.lineGraph,`y = ${line(m,b)}`,opts.choices,opts.correct,L.hints.lineGraph);q.key=`line-graph:${m}:${b}`;return q;}const m=pick([-2,-1,-.5,.5,1,2]),b=ri(-3,3),spec={kind:'line',m,b};const q=numberTask(L.q.lineSlope,'',m,L.hints.lineSlope,`k = ${f(m)}`,svgGraph(spec));q.key=`line-slope:${m}:${b}`;return q;}
function makeQuadraticFunction(){const mode=ri(0,2);if(mode===0){const a=pick([-1,1]),h=ri(-2,2),k=ri(-2,2),target={kind:'quad',a,h,k},opts=makeGraphChoices('quad',target);const inner=h===0?'x':`(x ${h>0?'−':'+'} ${Math.abs(h)})`;const expression= h===0?`x²`:`${inner}²`;const q=choiceTask(L.q.quadGraph,`y = ${a===-1?'−':''}${expression}${sign(k)}`,opts.choices,opts.correct,L.hints.quadGraph);q.key=`quad-graph:${a}:${h}:${k}`;return q;}if(mode===1){const h=ri(-3,3),k=ri(-3,3),a=pick([-1,1]);const q=pairTask(L.q.quadVertex,'',[h,k],L.hints.quadVertex,`(${h}; ${k})`,svgGraph({kind:'quad',a,h,k,markVertex:true}));q.key=`quad-vertex:${a}:${h}:${k}`;return q;}let r1=ri(-4,0),r2=ri(1,4);while(r2-r1>4){r1=ri(-4,0);r2=ri(1,4);}const a=pick([.5,1]);const h=(r1+r2)/2,k=-a*(r2-r1)**2/4;const q=pairTask(L.q.quadRoots,'',[r1,r2],L.hints.quadRoots,`x₁ = ${r1}, x₂ = ${r2}`,svgGraph({kind:'quad',a,h,k}));q.key=`quad-roots:${r1}:${r2}:${a}`;return q;}
function makeAdvancedArithmetic(){const a=ri(-15,17),b=ri(2,12),c=ri(2,8),mode=ri(0,3);
 if(mode===0)return numberTask('Вычисли',`(${f(a)}) + ${b} × ${c}`,a+b*c,'Сначала выполни умножение.');
 if(mode===1)return numberTask('Вычисли',`(${f(a)}) − (${f(-b)})`,a+b,'Вычитание отрицательного числа превращается в сложение.');

 return numberTask('Вычисли',`${b}² − ${c} × ${c}`,b*b-c*c,'Сначала степени и умножение, затем вычитание.');}
function makeIdentity(){const n=ri(1,9),signN=pick([-1,1]),mode=ri(0,2);
 if(mode===0)return numberTask('Найди коэффициент при x',`(x ${signN>0?'+':'−'} ${n})²`,signN*2*n,'Смешанное произведение возникает дважды.');
 if(mode===1)return numberTask('Найди свободный член',`(x ${signN>0?'+':'−'} ${n})²`,n*n,'Последний член — квадрат числа из скобки.');

function makeZeroProduct(){const r=pick([-7,-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,7]);

const generators={arithmetic:makeArithmetic,fractions:makeFractions,percentages:makePercent,powers:makePowers,linear_equations:makeLinearEq,quadratic_equations:makeQuadraticEq,linear_functions:makeLineFunction,quadratic_functions:makeQuadraticFunction,geometry:makeGeometry,arithmetic_plus:makeAdvancedArithmetic,formulas:makeIdentity,zero_product:makeZeroProduct};
const allTopics=Object.keys(generators),mixedSequence=[];
function nextMixedTopic(){if(!mixedSequence.length)mixedSequence.push(...shuffle(allTopics));return mixedSequence.shift();}
function newProblem(){const keyTopic=cfg.topic==='mixed'?nextMixedTopic():cfg.topic;let q;for(let i=0;i<120;i++){q=generators[keyTopic]();if(!state.seen.has(keyTopic+':'+q.key))break;}q.topic=keyTopic;state.seen.add(keyTopic+':'+q.key);return q;}
function htmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function numParse(s){const t=String(s).trim().replace(/−/g,'-').replace(/\s+/g,'').replace(',','.');if(/^[-+]?\d+(?:\.\d+)?\/[-+]?\d+(?:\.\d+)?$/.test(t)){const[a,b]=t.split('/').map(Number);return b!==0?a/b:NaN;}return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t)?Number(t):NaN;}
function render(){
 const q=state.current;$('topic-title').textContent=L.names[q.topic||cfg.topic]||'Все темы';$('topic-eyebrow').textContent=L.names[q.topic||cfg.topic]||'Все темы';$('brand-text').textContent=cfg.studentName?`Math Dojo · ${cfg.studentName}`:'Math Dojo';$('task-index').textContent=`${L.task} ${state.index+1} / ${cfg.sessionLength}`;$('score').textContent=`${state.firstTry} ✓`;

function selectChoice(i){if(state.answered)return;state.choice=i;document.querySelectorAll('.choice').forEach((b,k)=>b.classList.toggle('selected',k===i));}
function feedback(type,text){const el=$('feedback');el.className='feedback '+type;el.textContent=text;}

 else{feedback('bad',L.tryAgain);$('reveal').classList.remove('hidden');if(q.kind==='choice')document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('wrong',i===state.choice));}
}
function reveal(){const q=state.current;let ans=q.answer;if(q.kind==='choice'){ans='ABCD'[q.correct];document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q.correct);});}feedback('neutral',`${L.right}: ${ans}`);state.answered=true;$('primary').textContent=L.next;$('reveal').classList.add('hidden');}
function next(){if(state.index+1>=cfg.sessionLength){showSummary();return;}state.index++;state.current=newProblem();render();}
function onPrimary(){if(state.answered)next();else check();}
function showSummary(){state.finished=true;$('exercise').classList.add('hidden');$('summary').classList.remove('hidden');$('summary-title').textContent=L.finish;$('summary-detail').textContent=`${L.result}: ${state.firstTry} / ${cfg.sessionLength}`;$('again').textContent='Новая серия';$('task-index').textContent='';$('progress').innerHTML=Array.from({length:cfg.sessionLength},()=>'<span class="past"></span>').join('');}
function restart(){state.index=0;state.firstTry=0;state.seen.clear();state.finished=false;$('exercise').classList.remove('hidden');$('summary').classList.add('hidden');state.current=newProblem();render();}
function topicDialog(open){$('topic-overlay').classList.toggle('hidden',!open);if(open)$('close-topics').focus();}
$('topics-button').addEventListener('click',()=>topicDialog(true));$('close-topics').addEventListener('click',()=>topicDialog(false));$('topic-overlay').addEventListener('click',e=>{if(e.target===$('topic-overlay'))topicDialog(false);});document.addEventListener('keydown',e=>{if(e.key==='Escape')topicDialog(false);});
$('primary').addEventListener('click',onPrimary);$('skip').addEventListener('click',next);$('hint').addEventListener('click',()=>feedback('neutral',state.current.hint));$('reveal').addEventListener('click',reveal);$('again').addEventListener('click',restart);
$('topics-button').textContent=L.topics;$('topics-heading').textContent=L.topics;
$('topic-list').innerHTML=TOPICS.map(t=>`<a class="topic-link ${t===cfg.topic?'active':''}" href="${t}.html"><span class="topic-emoji">${ICONS[t]}</span><span>${htmlEscape(L.names[t])}</span></a>`).join('');
if(cfg.topic==='mixed'){L.names.mixed='Все темы';L.names.arithmetic_plus='Арифметика';L.names.formulas='Формулы сокращённого умножения';L.names.zero_product='Нулевое произведение';}
state.current=newProblem();render();
})();
</script></body></html>
