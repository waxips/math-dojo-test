<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4fd"><meta name="description" content="Практика математики: {{TITLE}}. Короткие серии с объяснениями."><title>{{TITLE}} · Math Dojo</title><style>{{STYLE}}</style></head><body data-topic="{{TOPIC}}"><div class="shell"><header class="bar"><a class="brand" href="../index.html">✦ Math Dojo</a><a class="go-back" href="../index.html">← Все темы</a></header><main>
<section class="card intro" id="intro"><div class="kicker">Алгебра · тренировка</div><h1 id="page-title"></h1><p class="lead" id="page-lead"></p><div class="learn"><strong>Ключевая идея</strong><span id="principle"></span><span class="sample" id="example"></span></div><button class="button" type="button" id="start">Начать: 12 заданий →</button><p class="note">Чередуются самостоятельный ввод и выбор ответа. Подсказки доступны для каждой задачи.</p></section>
<section id="exercise" class="hidden"><div class="progress-line"><span id="number"></span><span id="score"></span></div><div class="track"><div id="fill" class="fill"></div></div><div class="card"><div class="kicker">Разбираем шаг за шагом</div><h1 class="question" id="question"></h1><div class="formula" id="math"></div><label for="answer" class="small" id="answer-label">Твой ответ</label><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" class="input" id="answer" placeholder="Введи число" aria-label="Ответ"><div id="choices" class="choices hidden" role="group" aria-label="Варианты ответов"></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><div class="explain hidden" id="explain"></div><div class="feedback neutral hidden" id="hint-text"></div><div class="toolbar"><div class="tool-group"><button class="tool" type="button" id="hint">Подсказка</button><button class="tool hidden" type="button" id="reveal">Показать ответ</button><button class="tool" type="button" id="skip">Пропустить</button></div><button class="button" type="button" id="submit">Проверить</button></div></div></section>
